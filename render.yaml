services:
  - type: web
    name: facturaia-backend
    runtime: docker
    repo: https://github.com/niltra08-star/Verifactu
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: "8080"
