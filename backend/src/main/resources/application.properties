spring.application.name=facturaia

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:5432/postgres
spring.datasource.username=postgres.veiyxdruesilstxuupeh
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

facturaia.verifactu.mode=VERIFACTU_TEST
facturaia.verifactu.aeat.wsdl-url=https://preportal.aeat.es/verifactu/ws
facturaia.verifactu.aeat.test-mode=true
facturaia.verifactu.hash.algorithm=SHA-256
facturaia.verifactu.certificate.path=classpath:certificates/test-cert.pfx
facturaia.verifactu.certificate.password=changeme

facturaia.jwt.secret=${JWT_SECRET:facturaia-prod-jwt-secret-change-this-in-production}
facturaia.jwt.expiration-ms=86400000

logging.level.com.facturaia=INFO
