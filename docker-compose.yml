name: facturaia
services:
  postgres:
    image: postgres:16-alpine
    container_name: facturaia-db
    environment:
      POSTGRES_DB: facturaia
      POSTGRES_USER: facturaia
      POSTGRES_PASSWORD: facturaia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U facturaia"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facturaia-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/facturaia
      SPRING_DATASOURCE_USERNAME: facturaia
      SPRING_DATASOURCE_PASSWORD: facturaia
      FACTURAIA_VERIFACTU_AEAT_TEST_MODE: "true"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facturaia-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
